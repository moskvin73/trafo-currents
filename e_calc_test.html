<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инженерный калькулятор</title>

    <!-- Подключение конфигурации и автозагрузки MathJax из репозитория -->
    <script src="./js/math-script.js"></script>

    <style>

        html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* Запрет общей прокрутки страницы */
        }

        /* Основной контейнер */
        .app-container {
            --min-width: 15;
            --max-width: 50;
            display: grid;
            width: 100vw;
            height: 100vh;
            /* 1 колонка: центр, 2: разделитель, 3: правая панель */
            /* 1 строка: контент, 2: низ */
            grid-template-columns: 1fr 4px 30%;
            grid-template-rows: 1fr auto;
            box-sizing: border-box;
        }

        .main-center {
        grid-column: 1;
        grid-row: 1;
        overflow-y: auto; /* Независимый скролл */
        padding: 16px;
        }

        .resizer {
        grid-column: 2;
        grid-row: 1;
        background: #ccc;
        cursor: col-resize;
        user-select: none;
        }

        .side-panel {
        grid-column: 3;
        grid-row: 1;
        overflow-y: auto; /* Независимый скролл */
        background: #f4f4f4;
        padding: 16px;
        box-sizing: border-box;
        transition: transform 0.3s ease; /* Плавное скрытие */
        }

        .bottom-panel {
        grid-column: 1 / 4; /* На всю ширину */
        grid-row: 2;
        height: 60px; /* Начальный размер, меняется из JS */
        background: #e0e0e0;
        overflow: auto;
        box-sizing: border-box;
        }

        /* Класс для программного скрытия правой панели */
        .app-container.hide-side .resizer,
        .app-container.hide-side .side-panel {
        display: none;
        }

    </style>
</head>
<body>
    <div class="app-container">
        <div class="main-center">Центральный контент (скролл)</div>
        <div class="resizer" id="resizer"></div>
        <div class="side-panel" id="sidePanel">Правая панель (скролл / скрытие)</div>
        <div class="bottom-panel" id="bottomPanel">Низ (программируемый размер)</div>
    </div>

    <script>

        const resizer = document.getElementById('resizer');
        const container = document.querySelector('.app-container');
        const bottomPanel = document.getElementById('bottomPanel');
        let isResizing = false;

        // Изменение ширины правой панели мышью
        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.addEventListener('mousemove', resizeMove);
            document.addEventListener('mouseup', resizeUp);
        });

        function resizeMove(e) {
            if (!isResizing) return;

            const styles = getComputedStyle(container);
            const minVal = parseFloat(styles.getPropertyValue('--min-width'));
            const maxVal = parseFloat(styles.getPropertyValue('--max-width'));

            // Считаем ширину в процентах от окна
            const newWidthPx = window.innerWidth - e.clientX;
            const newWidthPercent = (newWidthPx / window.innerWidth) * 100;

            // Ограничиваем значениями из переменных
            if (newWidthPercent >= minVal && newWidthPercent <= maxVal) {
                container.style.gridTemplateColumns = `1fr 4px ${newWidthPercent}%`;
            }
        }

        function resizeUp() {
            isResizing = false;
            document.removeEventListener('mousemove', resizeMove);
            document.removeEventListener('mouseup', resizeUp);
        }

        // Пример программного изменения высоты нижней панели
        function setBottomPanelHeight(heightInPx) {
        bottomPanel.style.height = `${heightInPx}px`;
        }

        // Пример программного скрытия/показа правой панели
        function toggleSidePanel(show) {
        container.classList.toggle('hide-side', !show);
        }
    </script>
</body>
</html>
