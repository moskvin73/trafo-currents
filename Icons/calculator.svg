<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Корпус калькулятора -->
  <rect x="10" y="4" width="44" height="56" rx="8" fill="#2B3A42" />
  <rect x="12" y="6" width="40" height="52" rx="6" fill="#F0F4F8" />

  <!-- Экран -->
  <rect x="16" y="12" width="32" height="12" rx="3" fill="#1A252C" />
  <!-- Текст/цифры на экране (имитация) -->
  <rect x="20" y="16" width="16" height="4" rx="1" fill="#4DEEEA" opacity="0.8" />
  <circle cx="42" cy="18" r="2" fill="#4DEEEA" opacity="0.8" />

  <!-- Кнопки (Сетка) -->
  <!-- Ряд 1 -->
  <rect x="16" y="30" width="8" height="6" rx="1.5" fill="#CFD8DC" />
  <rect x="28" y="30" width="8" height="6" rx="1.5" fill="#CFD8DC" />
  <rect x="40" y="30" width="8" height="6" rx="1.5" fill="#3B82F6" /> <!-- Плюс -->

  <!-- Ряд 2 -->
  <rect x="16" y="40" width="8" height="6" rx="1.5" fill="#CFD8DC" />
  <rect x="28" y="40" width="8" height="6" rx="1.5" fill="#CFD8DC" />
  <rect x="40" y="40" width="8" height="6" rx="1.5" fill="#3B82F6" /> <!-- Минус -->

  <!-- Ряд 3 -->
  <rect x="16" y="50" width="8" height="6" rx="1.5" fill="#CFD8DC" />
  <!-- Кнопка Равно (двойная по ширине или яркая) -->
  <rect x="28" y="50" width="20" height="6" rx="1.5" fill="#10B981" /> <!-- Равно -->
</svg>